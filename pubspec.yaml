name: medi_care
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

#----------------- PACKAGES ------------------#

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.0

  flutter_timezone: ^5.0.0

  android_intent_plus: ^5.0.2

  permission_handler: ^11.3.1

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      ref: main
      path: workmanager

  lottie: ^3.1.2

  shared_preferences: ^2.3.2

  rxdart: ^0.28.0

  # Calendar
  table_calendar: ^3.0.9

  #Graph
  fl_chart: ^0.69.0

  #Messages
  another_flushbar: ^1.12.30

  # Utility Packages
  http: ^1.2.2
  intl: ^0.19.0
  logger: ^2.2.0
  url_launcher: ^6.2.2
  flutter_native_splash: ^2.4.6

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Product Specific
  # (Add any additional runtime packages here)

#--------------- ./ PACKAGES END ---------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/animations/
    - assets/logos/
    - assets/fonts/
    - assets/images/

fonts:
  - family: Roboto
    fonts:
      - asset: assets/fonts/Roboto-Italic-VariableFont_wdth,wght.ttf
      - style: italic
        asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
        weight: 400

flutter_native_splash:
  android: true
  ios: true
  web: false

  # Solid blue background (your app theme color)
  color: "#2D59F0"
  color_dark: "#2D59F0"

  # Solid logo (non-transparent)
  image: assets/images/medcross.png

  android_12:
    image: assets/images/medcross.png
    icon_background_color: "#2D59F0"

  fullscreen: true
  android_gravity: center
  ios_content_mode: scaleAspectFit

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_logo.png"
  min_sdk_android: 21

